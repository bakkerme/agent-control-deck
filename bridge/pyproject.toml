[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-control-deck-bridge"
version = "0.1.0"
description = "Host bridge: agent hooks → StatusSnapshot store (loopback HTTP + file adapter)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24.0",
]

[project.scripts]
acd-bridge = "agent_control_deck_bridge.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_control_deck_bridge"]

[tool.hatch.build]
[tool.hatch.build.targets.wheel.force-include]
"src/agent_control_deck_bridge" = "agent_control_deck_bridge"

[tool.hatch.build.targets.sdist]
include = ["src/agent_control_deck_bridge", "README.md", "examples", "tests"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
