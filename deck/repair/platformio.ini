; Aggressive e-paper recovery (classic ESP32 T5-ePaper).
; Not product firmware — flash, wait for DONE, then reflash ../ ACD.
;
;   cd deck/repair
;   pio run -t upload
;   pio device monitor

[platformio]
default_envs = repair
boards_dir = ../boards

[env:repair]
platform = espressif32@6.12.0
board = T5-ePaper
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder

build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DLILYGO_T5_EPD47
	-DESP_EXT1_WAKEUP_ANY_LOW=ESP_EXT1_WAKEUP_ALL_LOW

lib_deps =
	file://../../../LilyGo-EPD47
