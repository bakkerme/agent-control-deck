; Agent Control Deck — LilyGo T5-ePaper (classic ESP32)
;
;   pio run
;   pio run -t upload
;   pio device monitor
;
; Requires sibling checkout of LilyGo-EPD47 (see lib_deps path).

[platformio]
default_envs = T5-ePaper
boards_dir = boards

[env:T5-ePaper]
platform = espressif32@6.12.0
board = T5-ePaper
framework = arduino
upload_speed = 460800
monitor_speed = 115200
monitor_filters =
	default
	esp32_exception_decoder

build_flags =
	-DBOARD_HAS_PSRAM
	-DCORE_DEBUG_LEVEL=0
	-DLILYGO_T5_EPD47
	; Classic ESP32 EXT1 wake polarity differs from S3 APIs
	-DESP_EXT1_WAKEUP_ANY_LOW=ESP_EXT1_WAKEUP_ALL_LOW

; Display driver: local sibling of this monorepo
; sources/LilyGo-EPD47  +  sources/agent-control-deck/deck
lib_deps =
	file://../../LilyGo-EPD47
