name: Bridge reference checks
on:
  push:
    branches: [main]
    paths:
      - bridge/**
      - schema/**
      - Makefile
      - .github/workflows/bridge.yml
  pull_request:
    paths:
      - bridge/**
      - schema/**
      - Makefile
      - .github/workflows/bridge.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  bridge-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv --directory bridge sync --locked
      - run: make bridge-test schema-check
