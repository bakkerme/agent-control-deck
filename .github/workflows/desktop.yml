name: Desktop checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium --only-shell
      - run: npm run check
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        # Diagnostics are best-effort when GitHub artifact storage is full.
        continue-on-error: true
        with:
          name: desktop-diagnostics-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
