name: Packaged app checks
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - electron.vite.config.ts
      - tsconfig.json
      - playwright.config.ts
      - playwright.electron.config.ts
      - tests/electron-smoke.spec.ts
      - tests/native-lamps.spec.ts
      - tests/titlebar.spec.ts
      - tests/ui-helpers.ts
      - scripts/test-packaged.cjs
      - scripts/build-local-matching.mjs
      - scripts/chat-task-eval/desktop_setup.mjs
      - scripts/chat-task-eval/desktop_worker.py
      - scripts/chat-task-eval/local_worker.py
      - scripts/chat-task-eval/bundle_download.py
      - scripts/chat-task-eval/runtime-tools.mjs
      - scripts/chat-task-eval/benchmark-core.mjs
      - src/main/local-matcher.ts
      - src/shared/local-models.json
      - .github/workflows/packaged.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - .npmrc
      - electron.vite.config.ts
      - tsconfig.json
      - playwright.config.ts
      - playwright.electron.config.ts
      - tests/electron-smoke.spec.ts
      - tests/native-lamps.spec.ts
      - tests/titlebar.spec.ts
      - tests/ui-helpers.ts
      - scripts/test-packaged.cjs
      - scripts/build-local-matching.mjs
      - scripts/chat-task-eval/desktop_setup.mjs
      - scripts/chat-task-eval/desktop_worker.py
      - scripts/chat-task-eval/local_worker.py
      - scripts/chat-task-eval/bundle_download.py
      - scripts/chat-task-eval/runtime-tools.mjs
      - scripts/chat-task-eval/benchmark-core.mjs
      - src/main/local-matcher.ts
      - src/shared/local-models.json
      - .github/workflows/packaged.yml
  workflow_dispatch:
    inputs:
      upload_packaged_builds:
        description: "Upload packaged apps for download (retained for 3 days)"
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  packaged:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - run: npm run test:packaged
      - name: Upload failure diagnostics
        uses: actions/upload-artifact@v4
        if: failure()
        # Diagnostics are best-effort when GitHub artifact storage is full.
        continue-on-error: true
        with:
          name: packaged-diagnostics-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
      # Use Actions > Packaged app checks > Run workflow to request downloads.
      - name: Upload packaged builds
        uses: actions/upload-artifact@v4
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.upload_packaged_builds }}
        with:
          name: desktop-${{ matrix.os }}
          path: release/
          if-no-files-found: error
          retention-days: 3
